<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReSync Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <span>R</span>
        <div>
          <strong>ReSync</strong>
          <small>Intentional capture</small>
        </div>
      </div>
      <p id="status">Reading this page…</p>
      <textarea
        id="manualTranscript"
        hidden
        placeholder="YouTube transcript was not detected. Paste the full transcript here…"
      ></textarea>
      <div class="actions">
        <button id="capture" hidden>Try again</button>
        <button id="sendManual" hidden>Send pasted transcript</button>
      </div>
      <small class="privacy">
        ReSync saves in the background. The toolbar badge confirms the result.
      </small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
