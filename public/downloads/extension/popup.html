<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReSync Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span>R</span><div><strong>ReSync</strong><small>Capture</small></div></div>
      <button id="capture" class="primary">Send current tab</button>
      <p id="status" aria-live="polite">Ready.</p>
      <textarea id="manualTranscript" hidden placeholder="Paste the YouTube transcript here…"></textarea>
      <button id="sendManual" hidden>Send pasted transcript</button>
      <div class="divider"><span>or bulk add</span></div>
      <textarea id="bulkLinks" placeholder="Paste one link per line"></textarea>
      <button id="sendBulk">Send links</button>
      <section class="history">
        <strong>Recent</strong>
        <div id="historyList"><small>No saved links yet.</small></div>
      </section>
      <small class="privacy">Queued captures retry until ReSync confirms them.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
